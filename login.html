  <style>
    /* Login-only layout — reuses tokens from style.css?v=20260806mock, no new colors/fonts/shadows */
    body.login-page {
      margin: 0;
      min-height: 100dvh;
      background:
        radial-gradient(ellipse 90% 55% at 50% -10%, rgba(227, 61, 107, 0.14), transparent 55%),
        radial-gradient(ellipse 50% 40% at 100% 100%, rgba(212, 154, 44, 0.08), transparent),
        var(--void);
      color: var(--paper);
      font-family: var(--font-ui);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.25rem 1.25rem 2rem;
      -webkit-font-smoothing: antialiased;
    }

    .login-wrap {
      width: 100%;
      max-width: 22rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .login-logo {
      font-family: var(--font-stencil);
      font-size: clamp(1.9rem, 6vw, 2.35rem);
      color: var(--paper);
      letter-spacing: 0.04em;
      margin: 0 0 1.75rem;
      position: relative;
      line-height: 1;
    }
    .login-logo span { color: var(--rosa); }
    .login-logo::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -0.55rem;
      transform: translateX(-50%);
      width: 2.25rem;
      height: 3px;
      background: var(--rosa);
      border-radius: 2px;
    }

    /* —— Cri Cabrunco avatar —— */
    .cri-avatar {
      width: 6.25rem;
      height: 6.25rem;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 35% 30%, rgba(212, 154, 44, 0.18), transparent 55%),
        radial-gradient(circle at 70% 70%, rgba(227, 61, 107, 0.12), transparent 50%),
        var(--ink);
      border: 2px solid var(--ochre);
      box-shadow: var(--shadow-cartaz);
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
    }
    .cri-avatar svg { width: 72%; height: 72%; }

    .login-user {
      font-family: var(--font-condensed);
      font-weight: 600;
      font-size: 1.05rem;
      color: var(--paper);
      margin: 0 0 0.15rem;
      letter-spacing: 0.02em;
    }
    .login-sub {
      font-size: 0.74rem;
      color: var(--stone);
      margin: 0 0 1.5rem;
    }

    .login-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
    }

    .btn-login {
      appearance: none;
      border: none;
      font-family: var(--font-condensed);
      font-weight: 600;
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      border-radius: 999px;
      padding: 0.85rem 1.15rem;
      cursor: pointer;
      width: 100%;
      transition: var(--t-press);
    }
    .btn-login-primary {
      background: linear-gradient(180deg, var(--rosa) 0%, var(--rosa-deep) 100%);
      color: var(--cream);
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.4);
    }
    .btn-login-primary:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.4);
    }
    .btn-login-ghost {
      background: transparent;
      color: var(--paper);
      border: 2px solid rgba(235, 227, 207, 0.28);
    }
    .btn-login-ghost:active { transform: translateY(1px); }

    .login-link {
      font-family: var(--font-condensed);
      font-size: 0.8rem;
      color: var(--ochre);
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.35rem;
      letter-spacing: 0.03em;
    }
    .login-link:hover { color: var(--rosa); }

    /* Toggle Manter conectado */
    .save-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: rgba(235, 227, 207, 0.05);
      border: 1px solid rgba(235, 227, 207, 0.12);
      border-radius: var(--radius-card);
      padding: 0.7rem 0.9rem;
      margin: 1.35rem 0 0.25rem;
      gap: 0.75rem;
    }
    .save-label {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }
    .save-label strong {
      font-family: var(--font-condensed);
      font-size: 0.78rem;
      color: var(--paper);
      letter-spacing: 0.02em;
      font-weight: 600;
    }
    .save-label span {
      font-size: 0.66rem;
      color: var(--stone);
      margin-top: 0.15rem;
    }

    .toggle {
      position: relative;
      width: 2.5rem;
      height: 1.35rem;
      border-radius: 999px;
      background: var(--stone);
      border: none;
      cursor: pointer;
      flex: none;
      transition: background var(--dur-fast) var(--ease-in-out-soft);
      padding: 0;
    }
    .toggle[aria-checked="true"] { background: var(--rosa); }
    .toggle::after {
      content: "";
      position: absolute;
      top: 2px;
      left: 2px;
      width: 1.05rem;
      height: 1.05rem;
      border-radius: 50%;
      background: var(--cream);
      transition: transform var(--dur-fast) var(--ease-out-quart);
    }
    .toggle[aria-checked="true"]::after {
      transform: translateX(1.1rem);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      width: 100%;
      margin: 1.25rem 0 0.35rem;
    }
    .divider span {
      flex: 1;
      height: 1px;
      background: rgba(235, 227, 207, 0.15);
    }
    .divider small {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--stone);
      text-transform: uppercase;
      letter-spacing: 0.1em;
    }

    .btn-google {
      appearance: none;
      border: none;
      background: var(--cream);
      color: var(--ink);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.6rem;
      border-radius: 999px;
      padding: 0.8rem 1.15rem;
      font-family: var(--font-condensed);
      font-weight: 600;
      font-size: 0.8rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      box-shadow: 0 3px 0 rgba(0, 0, 0, 0.35);
      cursor: pointer;
      width: 100%;
      transition: var(--t-press);
    }
    .btn-google:active {
      transform: translateY(1px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.35);
    }
    .btn-google svg { width: 1.1rem; height: 1.1rem; flex: none; }

    .login-footer {
      margin-top: 2.25rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.85rem;
      width: 100%;
    }
    .login-footer .create-link {
      font-family: var(--font-condensed);
      font-size: 0.8rem;
      color: var(--paper);
      text-decoration: none;
      letter-spacing: 0.03em;
    }
    .login-footer .create-link:hover { color: var(--rosa); }
    .brandmark {
      font-family: var(--font-stencil);
      font-size: 0.9rem;
      color: var(--stone);
      letter-spacing: 0.08em;
    }
    .brandmark b { color: var(--ochre); font-weight: 400; }

    .auth-msg {
      font-size: 0.78rem;
      color: var(--terra);
      min-height: 1.2em;
      margin: 0.5rem 0 0;
    }
    .auth-msg.ok { color: var(--verde); }

    /* —— Birth animation overlay —— */
    #birth-overlay {
      position: fixed;
      inset: 0;
      z-index: 300;
      background: var(--void);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity var(--dur-med) var(--ease-out-quart), visibility var(--dur-med) linear;
    }
    #birth-overlay.is-on {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }
    .birth-wall {
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(90deg, transparent, transparent 40px, rgba(235,227,207,0.03) 40px, rgba(235,227,207,0.03) 41px),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(235,227,207,0.03) 40px, rgba(235,227,207,0.03) 41px),
        radial-gradient(ellipse 80% 50% at 50% 40%, rgba(212,154,44,0.12), transparent 70%),
        var(--ink);
      opacity: 0.9;
    }
    .birth-poster {
      position: relative;
      width: min(14rem, 70vw);
      aspect-ratio: 3/4;
      background: var(--cream);
      border: 3px solid var(--ochre-deep);
      box-shadow: var(--shadow-cartaz);
      display: flex;
      align-items: center;
      justify-content: center;
      transform: rotate(-2deg) scale(0.92);
      opacity: 0;
      transition: transform 0.7s var(--ease-out-expo), opacity 0.5s ease;
    }
    #birth-overlay.is-on .birth-poster {
      opacity: 1;
      transform: rotate(-1deg) scale(1);
    }
    .birth-poster.tear {
      animation: poster-tear 0.9s var(--ease-out-expo) forwards;
    }
    @keyframes poster-tear {
      0% { clip-path: inset(0 0 0 0); }
      40% { clip-path: inset(0 0 15% 0); transform: rotate(1deg) scale(1.02); }
      100% { clip-path: inset(0 0 55% 0); opacity: 0.3; transform: rotate(3deg) scale(1.04); }
    }
    .birth-cri {
      position: relative;
      width: 7.5rem;
      height: 7.5rem;
      margin-top: -2rem;
      opacity: 0;
      transform: scale(0.3) translateY(1.5rem);
      transition: opacity 0.5s var(--ease-out-quart), transform 0.7s var(--ease-spring);
      z-index: 2;
    }
    #birth-overlay.cri-born .birth-cri {
      opacity: 1;
      transform: scale(1) translateY(0);
    }
    .birth-line {
      margin-top: 1.5rem;
      font-family: var(--font-stencil);
      font-size: clamp(1.15rem, 4vw, 1.4rem);
      color: var(--paper);
      letter-spacing: 0.03em;
      opacity: 0;
      transform: translateY(0.6rem);
      transition: opacity 0.45s ease 0.15s, transform 0.45s var(--ease-out-quart) 0.15s;
      text-align: center;
      padding: 0 1rem;
    }
    #birth-overlay.cri-born .birth-line {
      opacity: 1;
      transform: translateY(0);
    }
    .birth-line em {
      font-style: normal;
      color: var(--rosa);
    }

    /* Reduced motion */
    html[data-a11y-motion="reduce"] #birth-overlay,
    html[data-a11y-motion="reduce"] .birth-poster,
    html[data-a11y-motion="reduce"] .birth-cri,
    html[data-a11y-motion="reduce"] .birth-line {
      transition: none !important;
      animation: none !important;
    }
    html[data-a11y-motion="reduce"] #birth-overlay.is-on .birth-poster { opacity: 1; transform: none; }
    html[data-a11y-motion="reduce"] #birth-overlay.cri-born .birth-cri { opacity: 1; transform: none; }
    html[data-a11y-motion="reduce"] #birth-overlay.cri-born .birth-line { opacity: 1; transform: none; }

    /* States visibility */
    #view-saved[hidden],
    #view-fresh[hidden] { display: none !important; }

    @media (prefers-reduced-motion: reduce) {
      #birth-overlay, .birth-poster, .birth-cri, .birth-line {
        transition: none !important;
        animation: none !important;
      }
    }

    /* QA a11y */
    .skip-link {
      position: absolute;
      left: 0.75rem; top: 0.75rem;
      z-index: 100;
      padding: 0.55rem 0.85rem;
      background: var(--ochre);
      color: var(--ink);
      font-weight: 700;
      font-size: 0.85rem;
      text-decoration: none;
      border-radius: 4px;
      transform: translateY(-150%);
    }
    .skip-link:focus,
    .skip-link:focus-visible {
      transform: none;
      outline: 2px solid var(--paper);
      outline-offset: 2px;
    }
    .btn-login:focus-visible,
    .btn-google:focus-visible,
    .toggle:focus-visible,
    .login-link:focus-visible {
      outline: 2px solid var(--ochre);
      outline-offset: 2px;
    }
    @media (max-width: 360px) {
      .login-wrap { padding: 1.25rem 0.85rem 2rem; }
      .login-logo { font-size: 2rem; }
    }
  </style>

  (function () {
    'use strict';

    var KEEP_KEY = 'cricri-keep-session';
    var SAVED_KEY = 'cricri-saved-user';
    var BIRTH_SEEN = 'cricri-birth-seen';

    var $ = function (id) { return document.getElementById(id); };
    var viewSaved = $('view-saved');
    var viewFresh = $('view-fresh');
    var toggleKeep = $('toggle-keep');
    var authMsg = $('auth-msg');

    var poster = $('birth-poster');

    function reducedMotion() {
      try {
        return document.documentElement.getAttribute('data-a11y-motion') === 'reduce'
          || window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      } catch (_) { return false; }
    }

    function setMsg(text, ok) {
      authMsg.textContent = text || '';
      authMsg.classList.toggle('ok', !!ok);
    }

    function getKeep() {
      try { return localStorage.getItem(KEEP_KEY) !== '0'; } catch (_) { return true; }
    }
    function setKeep(on) {
      try { localStorage.setItem(KEEP_KEY, on ? '1' : '0'); } catch (_) {}
      toggleKeep.setAttribute('aria-checked', on ? 'true' : 'false');
    }

    function getSavedUser() {
      try {
        var raw = localStorage.getItem(SAVED_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (_) { return null; }
    }
    function saveUser(user) {
      if (!getKeep()) return;
      try {
        localStorage.setItem(SAVED_KEY, JSON.stringify({
          id: user.id,
          name: (user.user_metadata && (user.user_metadata.full_name || user.user_metadata.name))
            || (user.email || '').split('@')[0]
            || 'Cri',
          email: user.email || ''
        }));
      } catch (_) {}
    }
    function clearSaved() {
      try { localStorage.removeItem(SAVED_KEY); } catch (_) {}
    }

    function showSaved(user) {
      viewFresh.hidden = true;
      viewSaved.hidden = false;
      $('saved-name').textContent = user.name || 'Cri';
    }
    function showFresh() {
      viewSaved.hidden = true;
      viewFresh.hidden = false;
    }

    /* —— Birth animation —— */
    function playBirth(thenGo) {
      var seen = false;
      try { seen = localStorage.getItem(BIRTH_SEEN) === '1'; } catch (_) {}
      // Só anima uma vez por aparelho (primeiro login / primeiro encontro)
      if (seen) {
        thenGo();
        return;
      }

      overlay.classList.add('is-on');
      overlay.setAttribute('aria-hidden', 'false');

      var t1 = reducedMotion() ? 80 : 600;
      var t2 = reducedMotion() ? 200 : 1100;
      var t3 = reducedMotion() ? 400 : 2600;

      setTimeout(function () {
        poster.classList.add('tear');
      }, t1);

      setTimeout(function () {
        overlay.classList.add('cri-born');
      }, t2);

      setTimeout(function () {
        try { localStorage.setItem(BIRTH_SEEN, '1'); } catch (_) {}
        try {
          if (window.CricriNotifs && window.CricriNotifs.Cri) window.CricriNotifs.Cri.born();
        } catch (_) {}
        overlay.classList.remove('is-on', 'cri-born');
        poster.classList.remove('tear');
        overlay.setAttribute('aria-hidden', 'true');
        thenGo();
      }, t3);
    }

    function goHome() {
      window.location.href = 'index.html';
    }

    /* —— Boot —— */
    async function boot() {
      setKeep(getKeep());

      // Se já tem sessão Supabase ativa e keep ligado → birth (se preciso) + home
      if (window.fascAuth) {
        try {
          var session = await window.fascAuth.session();
          if (session && session.user) {
            saveUser(session.user);
            if (getKeep()) {
              playBirth(goHome);
              return;
            }
          }
        } catch (_) {}
      }

      var saved = getSavedUser();
      if (saved && getKeep()) {
        showSaved(saved);
      } else {
        showFresh();
      }
    }

    /* —— Events —— */
    toggleKeep.addEventListener('click', function () {
      var on = toggleKeep.getAttribute('aria-checked') !== 'true';
      setKeep(on);
      if (!on) clearSaved();
    });

    $('btn-continue').addEventListener('click', function () {
      // Tenta sessão real; se não tiver, manda pro Google
      if (window.fascAuth) {
        window.fascAuth.session().then(function (s) {
          if (s && s.user) {
            playBirth(goHome);
          } else {
            // Sessão local só — pede Google de novo
            showFresh();
            setMsg('Sessão expirada. Entre de novo.');
          }
        }).catch(function () {
          showFresh();
        });
      } else {
        goHome();
      }
    });

    $('btn-other').addEventListener('click', function () {
      clearSaved();
      setKeep(false);
      showFresh();
    });

    $('btn-google').addEventListener('click', async function () {
      setMsg('');
      if (!window.fascAuth || !window.fascAuth.signInWithGoogle) {
        setMsg('Auth indisponível. Tente de novo.');
        return;
      }
      try {
        // Ajusta redirect para voltar ao login e depois animar
        // redirect OAuth → login.html (supabase-client) → animação → mural
        await window.fascAuth.signInWithGoogle();
      } catch (e) {
        setMsg((e && e.message) || 'Falha ao entrar com Google');
      }
    });

    // Retorno de OAuth (hash/query) — se logou, anima e vai
    if (window.fascAuth && window.fascAuth.onChange) {
      window.fascAuth.onChange(function (event, session) {
        if (event === 'SIGNED_IN' && session && session.user) {
          saveUser(session.user);
          playBirth(goHome);
        }
      });
    }

    // Também checa hash de erro OAuth
    try {
      var q = new URLSearchParams(window.location.search);
      var err = q.get('error_description') || q.get('error');
      if (!err && window.location.hash) {
        var h = new URLSearchParams(window.location.hash.replace(/^#/, ''));
        err = h.get('error_description') || h.get('error');
      }
      if (err) setMsg(decodeURIComponent(String(err).replace(/\+/g, ' ')));
    } catch (_) {}

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot);
    } else {
      boot();
    }
  })();
  </script>
