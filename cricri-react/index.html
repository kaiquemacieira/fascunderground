<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5" />
    <meta name="theme-color" content="#0c0a08" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F7F6F3" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CRICRI" />
    <title>CRICRI</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
      [vw-access-button],
      div[vw] {
        z-index: 9999 !important;
      }
      [vw-access-button] {
        bottom: 80px !important;
        right: 12px !important;
      }
      html.hide-vlibras [vw],
      html.hide-vlibras [vw-access-button] {
        display: none !important;
        visibility: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Widget VLibras oficial -->
    <div vw class="enabled">
      <div vw-access-button class="active"></div>
      <div vw-plugin-wrapper>
        <div class="vw-plugin-top-wrapper"></div>
      </div>
    </div>

    <script src="https://vlibras.gov.br/app/vlibras-plugin.js"></script>
    <script>
      (function initVLibras() {
        function boot() {
          try {
            if (window.VLibras && window.VLibras.Widget) {
              new window.VLibras.Widget('https://vlibras.gov.br/app');
              return true;
            }
          } catch (e) {
            console.warn('[CRICRI VLibras]', e);
          }
          return false;
        }
        if (!boot()) {
          var n = 0;
          var t = setInterval(function () {
            n++;
            if (boot() || n > 20) clearInterval(t);
          }, 400);
        }
      })();
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
