<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e33d6b">
  <title>CRICRI · Offline</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, sans-serif;
      background: #0c0a09; color: #ebe3cf; padding: 1.5rem; text-align: center;
    }
    .card {
      max-width: 22rem; padding: 1.5rem 1.25rem;
      border: 1.5px solid rgba(230,220,196,0.14); border-radius: 16px;
      background: #171412;
    }
    h1 {
      margin: 0 0 0.5rem; font-size: 1.35rem; letter-spacing: 0.06em;
      text-transform: uppercase; color: #e33d6b;
    }
    p { margin: 0 0 1rem; line-height: 1.45; color: #cfc5b4; font-size: 0.95rem; }
    a, button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0.65rem 1rem; border-radius: 999px; text-decoration: none;
      font-weight: 700; font-size: 0.85rem; letter-spacing: 0.04em; text-transform: uppercase;
      border: none; cursor: pointer;
    }
    .primary { background: #e33d6b; color: #fff; margin: 0.25rem; }
    .ghost { background: transparent; color: #ebe3cf; border: 1.5px solid rgba(230,220,196,0.22); margin: 0.25rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>CRICRI offline</h1>
    <p>Sem rede agora. Páginas e assets já visitados podem abrir; o mapa salvo e o Tamagotchi local continuam.</p>
    <p style="font-size:0.8rem;color:#8c8376">Quando a internet voltar, os dados sincronizam de novo.</p>
    <div>
      <a class="primary" href="./index.html">Tentar Home</a>
      <button class="ghost" type="button" onclick="location.reload()">Recarregar</button>
    </div>
  </div>
  <script src="js/sw-register.js"></script>
</body>
</html>
