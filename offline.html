<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <title>Offline · CRICRI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center;
      font-family: Inter, system-ui, sans-serif; background: #0A0A0A; color: #FAFAF7;
      padding: 1.5rem; text-align: center;
    }
    .card {
      max-width: 22rem; width: 100%;
      border: 1px solid rgba(250,250,247,.12); border-radius: 16px;
      padding: 1.75rem 1.35rem; background: #141414;
    }
    .mark { font-weight: 800; letter-spacing: -0.02em; font-size: 1.35rem; margin: 0 0 .35rem; }
    .mark span { color: #E6BE49; }
    p { margin: 0 0 1.25rem; color: rgba(250,250,247,.62); font-size: .92rem; line-height: 1.45; }
    a, button {
      display: inline-flex; align-items: center; justify-content: center;
      padding: .7rem 1.2rem; border-radius: 999px; border: none;
      background: #E6BE49; color: #1a1400; font-weight: 700; font-size: .88rem;
      text-decoration: none; cursor: pointer; min-height: 44px;
    }
    .ghost {
      margin-top: .65rem; background: transparent; border: 1px solid rgba(250,250,247,.18);
      color: rgba(250,250,247,.75);
    }
  </style>
</head>
<body>
  <div class="card">
    <p class="mark">CRI<span>CRI</span></p>
    <p>Você está offline. O shell do app continua disponível — tente de novo quando a rede voltar.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <br>
    <a class="ghost" href="./index.html">Ir à Home</a>
  </div>
  <script src="js/a11y-core.js?v=20260807fix1"></script>
  <script src="js/sw-register.js?v=8"></script>
</body>
</html>
