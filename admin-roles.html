<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" data-a11y-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0a08">
  <title>CRICRI · Admin Rolês</title>
  <link rel="stylesheet" href="style.css?v=20260805r">
  <style>
    body { margin:0; min-height:100dvh; background:#0c0a08; color:#ebe3cf; font-family:Inter,system-ui,sans-serif; padding:1rem 1rem 5rem; }
    h1 { font-family:Oswald,system-ui,sans-serif; letter-spacing:.06em; text-transform:uppercase; font-size:1.25rem; }
    .sub { color:#a89f90; font-size:.85rem; line-height:1.4; margin:0 0 1rem; }
    .card { border:1.5px solid rgba(230,220,196,.12); border-radius:14px; padding:1rem; margin:0 0 .75rem; background:#14110f; }
    .card h2 { margin:0 0 .35rem; font-size:1rem; }
    .meta { font-size:.78rem; color:#c4b9a6; line-height:1.4; }
    .actions { display:flex; gap:.4rem; margin-top:.65rem; flex-wrap:wrap; }
    .actions button { appearance:none; border-radius:10px; padding:.5rem .85rem; font:700 .72rem/1 Oswald,system-ui,sans-serif; letter-spacing:.05em; text-transform:uppercase; cursor:pointer; border:1.5px solid transparent; }
    .accept { background:#e33d6b; color:#fff; }
    .reject { background:transparent; color:#cfc5b4; border-color:rgba(230,220,196,.22); }
    .msg { font-size:.8rem; color:#8c8376; margin:.5rem 0; }
    .msg.ok { color:#7ecf9a; }
    .msg.err { color:#f5a3b8; }
    a { color:#e33d6b; }
  </style>
</head>
<body>
  <h1>Admin · Rolê/After</h1>
  <p class="sub">Aceite ou recuse solicitações. Aceitas podem aparecer no mapa. Entre com a conta admin no CRICRI.</p>
  <p class="msg" id="admin-msg">Carregando…</p>
  <div id="list"></div>

  <script src="js/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script>
  (function () {
    var ADMIN = (window.FASC_CONFIG && window.FASC_CONFIG.adminEmail) || 'kaaiqq@gmail.com';
    var list = document.getElementById('list');
    var msg = document.getElementById('admin-msg');

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');
    }

    async function load() {
      if (!window.fascDb) {
        msg.className = 'msg err';
        msg.textContent = 'Sem Supabase. Rode STEP_V_role_requests.sql e confira js/config.js';
        return;
      }
      var user = null;
      try {
        if (window.fascAuth && window.fascAuth.user) user = await window.fascAuth.user();
        else if (window.fascDb.auth) {
          var s = await window.fascDb.auth.getUser();
          user = s.data && s.data.user;
        }
      } catch (_) {}
      if (!user) {
        msg.className = 'msg err';
        msg.innerHTML = 'Faça login em <a href="login.html">login</a> com a conta admin (' + esc(ADMIN) + ').';
        return;
      }
      // lista pending — precisa de policy de select; se só own, admin não vê tudo.
      // fallback: tenta select * pending
      var res = await window.fascDb.from('role_requests').select('*').eq('status', 'pending').order('created_at', { ascending: false });
      if (res.error) {
        msg.className = 'msg err';
        msg.textContent = res.error.message || 'Erro ao listar';
        return;
      }
      var rows = res.data || [];
      msg.className = 'msg';
      msg.textContent = rows.length ? (rows.length + ' pendente(s)') : 'Nenhuma solicitação pendente.';
      list.innerHTML = '';
      rows.forEach(function (r) {
        var card = document.createElement('div');
        card.className = 'card';
        card.innerHTML =
          '<h2>' + esc(r.title) + ' · ' + esc(r.kind) + '</h2>' +
          '<p class="meta">' +
            esc(r.when_text || 'sem horário') + '<br>' +
            esc(r.notes || '') + '<br>' +
            'Contato: ' + esc(r.contact || '—') + ' · @' + esc(r.handle || '—') + '<br>' +
            'Coords: ' + Number(r.lat).toFixed(5) + ', ' + Number(r.lng).toFixed(5) + '<br>' +
            '<a href="https://www.openstreetmap.org/?mlat=' + r.lat + '&mlon=' + r.lng + '#map=17/' + r.lat + '/' + r.lng + '" target="_blank" rel="noopener">Ver no mapa</a>' +
          '</p>' +
          '<div class="actions">' +
            '<button type="button" class="accept" data-id="' + esc(r.id) + '" data-act="accepted">Aceitar</button>' +
            '<button type="button" class="reject" data-id="' + esc(r.id) + '" data-act="rejected">Recusar</button>' +
          '</div>';
        list.appendChild(card);
      });
    }

    list.addEventListener('click', async function (e) {
      var b = e.target.closest('[data-act]');
      if (!b) return;
      var id = b.getAttribute('data-id');
      var act = b.getAttribute('data-act');
      b.disabled = true;
      var res = await window.fascDb.from('role_requests').update({
        status: act,
        reviewed_at: new Date().toISOString()
      }).eq('id', id);
      if (res.error) {
        msg.className = 'msg err';
        msg.textContent = res.error.message || 'Falha ao atualizar';
        b.disabled = false;
        return;
      }
      msg.className = 'msg ok';
      msg.textContent = act === 'accepted' ? 'Aceito — pode aparecer no mapa.' : 'Recusado.';
      load();
    });

    load();
  })();
  </script>
</body>
</html>
